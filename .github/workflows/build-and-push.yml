name: Build and Push Docker Image

on:
  push:
    branches: [main, ci/github-actions-pipeline] # TEMP: verifying on this branch before merge, reverted before merge
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/app.Dockerfile
          push: true
          tags: |
            ghcr.io/marcy-ever/everletter-ops-crm:latest
            ghcr.io/marcy-ever/everletter-ops-crm:${{ github.sha }}
