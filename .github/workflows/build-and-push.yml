name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Generated here, not derived from the commit's own timestamp - a
      # rebuild of an old commit (a manual workflow_dispatch re-run, say)
      # should say when it was actually built, not when that commit was
      # authored. Pre-formatted to lib/build-info.ts's exact display shape
      # (`TZ=America/Denver date '+%Y-%m-%d %H:%M MT'`) so nothing downstream
      # parses or
      # reformats a timestamp - it's a build-time string literal end to
      # end. github.sha is the full 40-character SHA; shortened here to
      # the 7-character form the UI actually shows.
      - name: Compute build identity
        id: build_identity
        run: |
          echo "build_time=$(TZ=America/Denver date '+%Y-%m-%d %H:%M MT')" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/app.Dockerfile
          push: true
          tags: |
            ghcr.io/marcy-ever/everletter-ops-crm:latest
            ghcr.io/marcy-ever/everletter-ops-crm:${{ github.sha }}
          build-args: |
            BUILD_TIME=${{ steps.build_identity.outputs.build_time }}
            COMMIT_SHA=${{ steps.build_identity.outputs.short_sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Gate on the push event specifically (not just the branch) so a manual
    # workflow_dispatch run - e.g. to test the build step - never triggers a
    # NAS deploy on its own.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: SSH into NAS and run deploy.sh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.FT_SSH_HOST }}
          username: ${{ secrets.FT_SSH_USER }}
          port: ${{ secrets.FT_SSH_PORT }}
          key: ${{ secrets.FT_SSH_PRIVATE_KEY }}
          script: ~/lyra/everletter-ops-crm/devops/deploy.sh
