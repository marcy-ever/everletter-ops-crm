# This file lives in devops/, not the repo root. Compose's default project
# directory (and thus project name / any relative paths) is derived from the
# directory containing this file unless overridden, so it must always be run
# with `--project-directory <repo root>` and an explicit project name -
# see the `docker:up`/`docker:up:full`/`docker:down` scripts in package.json,
# which set both.
#
# Split into two files - this one (Postgres only) and
# devops/docker-compose.app.yml (the containerized app) - specifically so a
# Postgres-only local dev startup (`pnpm docker:up`) never has to satisfy the
# app service's required auth vars. Compose interpolates every ${VAR} in
# whichever file(s) are passed to it at parse time, regardless of which
# service you actually start - profiles (the mechanism this used to use,
# `profiles: ["full"]` on the app service) don't change that: profiles only
# gate which services *start*, not which services get *parsed*. So as long as
# the app service lived in this same file, a bare `pnpm docker:up` on a fresh
# clone (no AUTH_SECRET/AUTH_URL/etc. yet) failed before Postgres ever
# started, even though nothing about starting Postgres needs those vars. File
# separation replaces the profile gate entirely - there is no `profiles:` key
# anywhere anymore, and none is needed.
#
# `docker:up` (package.json) passes only this file. `docker:up:full` and
# `docker:down` pass this file *and* devops/docker-compose.app.yml together
# (`-f devops/docker-compose.yml -f devops/docker-compose.app.yml`) - both
# `-f` flags are required any time the app service is involved, because the
# app service's `depends_on: postgres` (in the other file) only resolves once
# Compose merges both files into one project; passing just the app file alone
# would reference a `postgres` service Compose has no definition for.
#
# Postgres credentials below are read via ${VAR} interpolation from the repo
# root's .env.local (each environment - dev VM, NAS - has its own,
# gitignored, supplying its own real value). Compose only auto-loads a file
# literally named `.env`, not `.env.local`, so every invocation here passes
# `--env-file .env.local` explicitly (see docker:up/docker:up:full/docker:down
# in package.json, and devops/deploy.sh). POSTGRES_PASSWORD is required and
# fails loudly if unset rather than silently booting with a weak password;
# POSTGRES_USER/POSTGRES_DB have dev-safe fallbacks. .env.example documents
# the expected keys.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-everletter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-everletter_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-everletter} -d ${POSTGRES_DB:-everletter_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
