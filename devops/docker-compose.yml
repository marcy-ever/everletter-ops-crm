# This file lives in devops/, not the repo root. Compose's default project
# directory (and thus project name / any relative paths) is derived from the
# directory containing this file unless overridden, so it must always be run
# with `--project-directory <repo root>` and an explicit project name -
# see the `docker:up`/`docker:down` scripts in package.json, which set both.
#
# Postgres credentials below are read via ${VAR} interpolation from the repo
# root's .env.local (each environment - dev VM, NAS - has its own, gitignored,
# supplying its own real value). Compose only auto-loads a file literally
# named `.env`, not `.env.local`, so every invocation here passes
# `--env-file .env.local` explicitly (see docker:up/docker:up:full/docker:down
# in package.json, and devops/deploy.sh). POSTGRES_PASSWORD is required and
# fails loudly if unset rather than silently falling back to something weak;
# POSTGRES_USER/POSTGRES_DB have dev-default fallbacks since they're
# lower-stakes. .env.example documents the expected keys.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-everletter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-everletter_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-everletter} -d ${POSTGRES_DB:-everletter_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Containerized app, for full-stack verification and eventual NAS deployment.
  # Not part of the default `up` (see `docker:up` vs `docker:up:full` in
  # package.json) - local iteration normally uses `pnpm dev` against this same
  # Postgres service, and there's no reason to also run a redundant
  # containerized instance alongside it.
  app:
    profiles: ["full"]
    # `image:` names the tag that `build:` produces locally (docker:up:full
    # passes --build) and is also what `docker compose pull` targets on its
    # own - the NAS deploy script pulls the CI-built image via this tag
    # instead of building from source.
    image: ghcr.io/marcy-ever/everletter-ops-crm:latest
    build:
      context: .
      dockerfile: devops/app.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-everletter}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-everletter_dev}
    ports:
      - "3100:3000"

volumes:
  postgres-data:
