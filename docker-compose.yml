services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: everletter
      POSTGRES_PASSWORD: everletter
      POSTGRES_DB: everletter_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everletter -d everletter_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
